<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 主要连接结构 - 六边形 -->
  <path
    d="M100,40 L150,70 L150,130 L100,160 L50,130 L50,70 Z"
    fill="none"
    stroke="#000000"
    stroke-width="3"
  />

  <!-- 内部连接线 -->
  <line x1="100" y1="40" x2="100" y2="160" stroke="#000000" stroke-width="2" />
  <line x1="50" y1="70" x2="150" y2="130" stroke="#000000" stroke-width="2" />
  <line x1="50" y1="130" x2="150" y2="70" stroke="#000000" stroke-width="2" />

  <!-- 节点 -->
  <circle cx="100" cy="40" r="6" fill="#000000" />
  <circle cx="150" cy="70" r="6" fill="#000000" />
  <circle cx="150" cy="130" r="6" fill="#000000" />
  <circle cx="100" cy="160" r="6" fill="#000000" />
  <circle cx="50" cy="130" r="6" fill="#000000" />
  <circle cx="50" cy="70" r="6" fill="#000000" />

  <!-- 中心节点 - 稍大一些 -->
  <circle cx="100" cy="100" r="10" fill="#000000" />

  <!-- 橙色强调点 -->
  <circle cx="100" cy="40" r="8" fill="#FF5000" />

  <!-- 文字 -->
  <text
    x="100"
    y="190"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-weight="300"
    letter-spacing="3"
    text-anchor="middle"
    fill="#000000"
  >
    NEXUS
  </text>

  <!-- 金属质感（橙金色） -->
  <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
    <stop offset="30%" style="stop-color:#FF8C00;stop-opacity:1" />
    <stop offset="70%" style="stop-color:#FF5000;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
  </linearGradient>

  <!-- 彩虹渐变（从橙色过渡到紫色） -->
  <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#FF5000;stop-opacity:1" />
    <stop offset="25%" style="stop-color:#FF7F00;stop-opacity:1" />
    <stop offset="50%" style="stop-color:#FFAA00;stop-opacity:1" />
    <stop offset="75%" style="stop-color:#FF5500;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#CC3300;stop-opacity:1" />
  </linearGradient>
</svg>