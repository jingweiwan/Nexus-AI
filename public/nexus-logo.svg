<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 主要连接结构 - 六边形 -->
  <path
    d="M100,40 L150,70 L150,130 L100,160 L50,130 L50,70 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
  />

  <!-- 内部连接线 -->
  <line x1="100" y1="40" x2="100" y2="160" stroke="#FFFFFF" stroke-width="2" />
  <line x1="50" y1="70" x2="150" y2="130" stroke="#FFFFFF" stroke-width="2" />
  <line x1="50" y1="130" x2="150" y2="70" stroke="#FFFFFF" stroke-width="2" />

  <!-- 节点 -->
  <circle cx="100" cy="40" r="6" fill="#FFFFFF" />
  <circle cx="150" cy="70" r="6" fill="#FFFFFF" />
  <circle cx="150" cy="130" r="6" fill="#FFFFFF" />
  <circle cx="100" cy="160" r="6" fill="#FFFFFF" />
  <circle cx="50" cy="130" r="6" fill="#FFFFFF" />
  <circle cx="50" cy="70" r="6" fill="#FFFFFF" />

  <!-- 中心节点 - 稍大一些 -->
  <circle cx="100" cy="100" r="10" fill="#FFFFFF" />

  <!-- 文字 -->
  <text
    x="100"
    y="190"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-weight="300"
    letter-spacing="3"
    text-anchor="middle"
    fill="#FFFFFF"
  >
    NEXUS
  </text>
</svg>